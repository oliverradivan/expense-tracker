<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link id="apple-touch-icon" rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0d" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fathom | Expense Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const appleTouchIcon = document.getElementById('apple-touch-icon')
      const systemAppearance = window.matchMedia('(prefers-color-scheme: dark)')
      const updateAppleTouchIcon = () => {
        appleTouchIcon.href = systemAppearance.matches ? '/apple-touch-icon-dark.png' : '/apple-touch-icon.png'
      }
      updateAppleTouchIcon()
      systemAppearance.addEventListener?.('change', updateAppleTouchIcon)
    </script>
  </body>
</html>
