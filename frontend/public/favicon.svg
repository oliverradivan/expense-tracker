<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="fathom coin" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>fathom coin</title>
  <defs>
    <!-- rim: yellow to red, 135deg across the whole coin -->
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0" stop-color="#e0b21f"/>
      <stop offset="1" stop-color="#e04f4f"/>
    </linearGradient>
    <!-- shekel: same colours, positioned as on the real coin (coordinates are glyph units) -->
    <linearGradient id="shekel" gradientUnits="userSpaceOnUse" x1="-12.87" y1="-26.87" x2="71.35" y2="57.35">
      <stop offset="0" stop-color="#e0b21f"/>
      <stop offset="1" stop-color="#e04f4f"/>
    </linearGradient>
  </defs>

  <style>
    /* dark mode: only the face changes; rim, dashes and shekel keep their colours */
    @media (prefers-color-scheme: dark) {
      .face { fill: #222527; }
    }
  </style>

  <!-- face -->
  <circle class="face" cx="256" cy="256" r="247.27" fill="#ededed"/>

  <!-- gradient rim (3px at 88px size) -->
  <circle class="rim" cx="256" cy="256" r="247.27" fill="none" stroke="url(#rim)" stroke-width="17.45"/>

  <!-- dashed inner ring: 43 dashes, 1px at 88px size, #e04f4f at 45% -->
  <circle class="dashes" cx="256" cy="256" r="200.73" fill="none" stroke="#e04f4f" stroke-opacity=".45" stroke-width="5.82" stroke-dasharray="16.9 12.43" transform="rotate(1.83 256 256)"/>

  <!-- shekel sign, drawn as outlines (no font needed) -->
  <g class="shekel" transform="translate(171.64 212.36) scale(2.90909)" fill="url(#shekel)">
    <path d="M0 0H30.57A10.47 10.47 0 0 1 41.04 10.47V29.78H34.26V11.55A7.09 7.09 0 0 0 27.17 4.46H6.78V47.29H0ZM51.14 0H57.92V34.68A12.62 12.62 0 0 1 45.3 47.29H16.83V17.28H23.61V42.5H44.15A6.99 6.99 0 0 0 51.14 35.51Z"/>
  </g>
  <style>
    @media (max-width: 32px) {
      .dashes { display: none; }
      .rim { stroke-width: 23.27; }
      .shekel path { stroke: url(#shekel); stroke-width: 3.5; stroke-linejoin: round; }
    }
  </style>
</svg>
