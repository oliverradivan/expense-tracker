<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="coin-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0b21f" />
      <stop offset="1" stop-color="#e04f4f" />
    </linearGradient>
    <linearGradient id="coin-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ededed" />
      <stop offset="1" stop-color="#fff" />
    </linearGradient>
  </defs>
  <style>
    .coin-fill { fill: url(#coin-fill); }
    .rim { fill: none; stroke: url(#coin-gradient); }
    .glyph { fill: url(#coin-gradient); }
    .small-rim { display: none; }
    .dash { fill: none; stroke: #e04f4f; stroke-opacity: .45; stroke-width: 1; stroke-dasharray: 1 2.1; }
    @media (prefers-color-scheme: dark) {
      .coin-fill { fill: #222527; }
    }
    @media (max-width: 32px) {
      .rim, .dash { display: none; }
      .small-rim { display: block; fill: none; stroke: url(#coin-gradient); stroke-width: 4; }
      .glyph { stroke: url(#coin-gradient); stroke-width: 1.3; stroke-linejoin: round; }
    }
  </style>
  <circle class="coin-fill" cx="50" cy="50" r="47" />
  <circle class="rim" cx="50" cy="50" r="48.5" stroke-width="3" />
  <circle class="small-rim" cx="50" cy="50" r="46" />
  <circle class="dash" cx="50" cy="50" r="40" />
  <!-- Hand outlined serif construction of the shekel sign (₪); no font is needed at runtime. -->
  <g class="glyph" transform="translate(50 51) scale(.74) translate(-50 -50)" fill-rule="evenodd">
    <path d="M32 20h36v5H38v13h25c9 0 14 5 14 14v19h-6V53c0-7-3-10-9-10H38v19h29v5H38v13h30v5H32V67h-9v-5h9V43h-9v-5h9V20Zm12 7h6v30h-6V27Zm15 0h6v30h-6V27Z" />
  </g>
</svg>
